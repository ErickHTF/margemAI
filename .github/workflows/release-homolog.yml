name: Release Homologação (Pre-Release)

on:
  push:
    branches:
      - 'staging'
      - 'homolog'
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Sufixo da versão de homologação (ex: rc.1, beta.1)'
        required: false
        default: 'rc.1'

permissions:
  contents: write

jobs:
  build-and-pre-release:
    name: Build & Publish Homologation Pre-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Grant execute permission for mvnw
        run: chmod +x backend/mvnw

      - name: Build Backend Package
        working-directory: ./backend
        run: |
          ./mvnw clean package -DskipTests
          mv target/*.jar ../margemai-backend-homolog.jar

      - name: Build Frontend Distribution
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          cd dist && zip -r ../../margemai-frontend-homolog.zip .

      - name: Generate Tag & Release Name
        id: vars
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          SUFFIX="${{ github.event.inputs.version_suffix || 'rc' }}"
          TAG_NAME="v0.1.0-${SUFFIX}.${DATE}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=Homologação ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            margemai-backend-homolog.jar
            margemai-frontend-homolog.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
