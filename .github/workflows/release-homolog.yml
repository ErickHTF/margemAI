name: Release de homologação

on:
  push:
    branches:
      - 'staging'
      - 'homolog'
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Sufixo da versão de homologação (ex: rc.1, beta.1)'
        required: false
        default: 'rc.1'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-pre-release:
    name: Build & Publish Homologation Pre-Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Publica exatamente o que o CI testou, em vez de compilar de novo.
      - name: Download Backend Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-jar
          path: artifacts/backend

      - name: Download Frontend Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: artifacts/frontend

      - name: Package Release Assets
        run: |
          mv artifacts/backend/*.jar margemai-backend-homolog.jar
          (cd artifacts/frontend && zip -qr ../../margemai-frontend-homolog.zip .)

      - name: Generate Tag & Release Name
        id: vars
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          SUFFIX="${{ github.event.inputs.version_suffix || 'rc' }}"
          TAG_NAME="v0.1.0-${SUFFIX}.${DATE}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=Homologação ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            margemai-backend-homolog.jar
            margemai-frontend-homolog.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
