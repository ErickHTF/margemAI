name: Deploy margemai.site

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: margemai-static-prod
  CLOUDFRONT_DISTRIBUTION_ID: EGOC0JSDZZ0QR
  BACKEND_INSTANCE_ID: i-0c1911094190771e8

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Extrair versão da tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: Build do React (Vite) com versão
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          # A API é servida pelo mesmo domínio: o CloudFront encaminha /v1/* para o backend
          VITE_API_URL: /v1

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::703547554329:role/margemai-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Atualizar backend no EC2 (via SSM)
        run: |
          # O servidor busca a tag no GitHub, recompila e reinicia o backend com Docker Compose.
          # Os segredos ficam no SSM Parameter Store e nunca passam pelo GitHub.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$BACKEND_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1800 \
            --comment "Deploy ${APP_VERSION}" \
            --parameters "commands=[\"/opt/margemai/deploy.sh ${APP_VERSION}\"]" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $COMMAND_ID"

          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$BACKEND_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "$BACKEND_INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -40
                echo "Deploy do backend falhou: $STATUS"
                exit 1 ;;
            esac
            sleep 20
          done

          [ "$STATUS" = "Success" ] || { echo "Deploy do backend excedeu o tempo limite"; exit 1; }
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$BACKEND_INSTANCE_ID" --query StandardOutputContent --output text | tail -5

      - name: Deploy do frontend para S3 (cache correto)
        working-directory: ./frontend
        run: |
          # Bucket exclusivo deste projeto: arquivos com hash em /assets/ ficam em cache por 1 ano
          aws s3 sync dist/assets/ "s3://${S3_BUCKET}/assets/" \
            --delete \
            --cache-control "max-age=31536000,public"

          aws s3 sync dist/ "s3://${S3_BUCKET}" \
            --cache-control "max-age=31536000,public" \
            --exclude "index.html" \
            --exclude "assets/*"

          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/assets/*" "/favicon*"
