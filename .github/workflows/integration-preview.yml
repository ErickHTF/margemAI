name: Prévia de integração

# Cada PR passa no CI sozinho, mas PRs abertos ao mesmo tempo podem quebrar quando juntos.
# Este workflow junta a branch base + todos os PRs abertos para ela (develop e PPS) e roda a mesma validação do CI,
# avisando antes do merge quais PRs conflitam ou quebram em conjunto.

on:
  push:
    branches:
      - 'develop'
      - 'PPS'
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: integration-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  integrate:
    name: Integrar PRs abertos em ${{ matrix.base }}
    strategy:
      fail-fast: false
      matrix:
        base: ${{ github.event_name == 'push' && fromJSON(format('["{0}"]', github.ref_name)) || fromJSON('["develop", "PPS"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.base }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Merge open PRs into base
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          {
            echo "## Prévia de integração sobre \`${{ matrix.base }}\` ($(git rev-parse --short HEAD))"
            echo
            echo "| PR | Branch | Merge |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          conflicts=0
          merged=0
          while IFS=$'\t' read -r number branch; do
            git fetch -q origin "pull/${number}/head:pr-${number}"
            if git merge -q --no-ff --no-edit "pr-${number}" -m "integração: #${number}" >/dev/null 2>&1; then
              echo "| #${number} | \`${branch}\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
              merged=$((merged + 1))
            else
              files="$(git diff --name-only --diff-filter=U | paste -sd ',' - | sed 's/,/, /g')"
              git merge --abort
              echo "| #${number} | \`${branch}\` | ❌ conflito: ${files} |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::PR #${number} (${branch}) conflita com ${{ matrix.base }} + PRs anteriores: ${files}"
              conflicts=$((conflicts + 1))
            fi
          done < <(gh pr list --base "${{ matrix.base }}" --state open --draft=false --limit 100 \
                     --json number,headRefName --jq 'sort_by(.number)[] | "\(.number)\t\(.headRefName)"')

          echo >> "$GITHUB_STEP_SUMMARY"
          echo "PRs integrados: ${merged} · com conflito: ${conflicts}" >> "$GITHUB_STEP_SUMMARY"
          echo "conflicts=${conflicts}" >> "$GITHUB_OUTPUT"

      - name: Run full validation on the integrated tree
        id: check
        run: |
          chmod +x backend/mvnw scripts/*.sh
          set -o pipefail
          scripts/check.sh 2>&1 | tee check.log

      - name: Report
        if: always()
        run: |
          {
            echo
            echo "### Validação (scripts/check.sh)"
            echo '```'
            sed -n '/^[✓✗]/p' check.log 2>/dev/null || echo "não executada"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.merge.outputs.conflicts }}" != "0" ]; then
            echo "::error::Há PRs que conflitam entre si. Veja o resumo do workflow."
            exit 1
          fi
