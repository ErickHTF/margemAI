name: Release Produção (Main Merge)

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de versão oficial (ex: v0.1.0, v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release-prod:
    name: Build & Publish Production Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Grant execute permission for mvnw
        run: chmod +x backend/mvnw

      - name: Run Backend Tests
        working-directory: ./backend
        run: ./mvnw test

      - name: Build Backend Production Package
        working-directory: ./backend
        run: |
          ./mvnw clean package -DskipTests
          mv target/*.jar ../margemai-backend-production.jar

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run build
          cd dist && zip -r ../../margemai-frontend-production.zip .

      - name: Determine Semantic Release Version
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            COMMITS=$(git rev-list --count HEAD)
            TAG="v0.1.${COMMITS}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=Margem.AI Release ${TAG}" >> $GITHUB_OUTPUT

      - name: Create Official GitHub Production Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: ${{ steps.versioning.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            margemai-backend-production.jar
            margemai-frontend-production.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
