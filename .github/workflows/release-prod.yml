name: Release Produção (Main Merge)

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de versão oficial (ex: v0.1.0, v1.0.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-release-prod:
    name: Build & Publish Production Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Publica exatamente o que o CI testou, em vez de compilar de novo.
      - name: Download Backend Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-jar
          path: artifacts/backend

      - name: Download Frontend Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: artifacts/frontend

      - name: Package Release Assets
        run: |
          mv artifacts/backend/*.jar margemai-backend-production.jar
          (cd artifacts/frontend && zip -qr ../../margemai-frontend-production.zip .)

      - name: Determine Semantic Release Version
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            COMMITS=$(git rev-list --count HEAD)
            TAG="v0.1.${COMMITS}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=Margem.AI Release ${TAG}" >> $GITHUB_OUTPUT

      - name: Create Official GitHub Production Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: ${{ steps.versioning.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            margemai-backend-production.jar
            margemai-frontend-production.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
